name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-doctor:
    name: Windows diagnostics / Python ${{ matrix.python-version }}
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Check out exact proposed head (or pushed main)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and pytest
        run: python -m pip install . pytest
      - name: Record tested commit
        run: git rev-parse HEAD
      - name: Run bounded doctor and CLI tests (not full GUI parity)
        run: python -m pytest tests/test_doctor.py -ra

  linux-tests:
    name: Linux / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Minimum supported runtime and a newer supported runtime.
        python-version: ["3.11", "3.13"]
    steps:
      - name: Check out exact proposed head (or pushed main)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install headless test display
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb
      - name: Install project and pytest
        run: python -m pip install . pytest
      - name: Record tested commit
        run: git rev-parse HEAD
      - name: Run complete test suite
        run: xvfb-run --auto-servernum python -m pytest -ra
